<h2>Add Google Form Test</h2>

<form method="POST">
    <input type="text" name="title" placeholder="Test Title" required><br><br>
    <input type="text" name="form_link" placeholder="Google Form Link" required><br><br>
    <input type="text" name="csv_link" placeholder="Google Sheet CSV Link" required><br><br>
    <button type="submit">Create Test</button>
</form>

<hr>

<h2>Available Tests</h2>
{% for test in tests %}
    <p>
        <b>{{ test.title }}</b>
        <a href="{{ test.google_form_link }}" target="_blank">Open Test</a>
    </p>
{% endfor %}

<hr>

<h2>Results</h2>
<table border="1">
<tr>
    <th>Student</th>
    <th>HTNO</th>
    <th>Test</th>
    <th>Score</th>
</tr>
{% for r in results %}
<tr>
    <td>{{ r.student_name }}</td>
    <td>{{ r.htno }}</td>
    <td>{{ r.test_title }}</td>
    <td>{{ r.score }}</td>
</tr>
{% endfor %}
</table>
