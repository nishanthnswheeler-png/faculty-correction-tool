<!DOCTYPE html>
<html>
<head>
    <title>{{ test.title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>{{ test.title }}</h2>

        <form method="POST">
            {% for question in questions %}
                <p><b>Q{{ loop.index }}.</b> {{ question }}</p>
                <textarea name="answer_{{ loop.index0 }}" rows="3" required></textarea><br><br>
            {% endfor %}

            <button type="submit">Submit Test</button>
        </form>
    </div>
</body>
</html>
